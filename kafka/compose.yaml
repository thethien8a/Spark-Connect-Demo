x-kafka-common: &kafka-common
  image: apache/kafka:4.3.0
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s
  networks:
    - platform

x-kafka-environment: &kafka-environment
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_NUM_PARTITIONS: "3"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: "168"
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  TZ: UTC

x-connect-common: &connect-common
  image: spark-connect-lab/kafka-connect:4.3.0-debezium-3.6.1
  pull_policy: never
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    kafka-1:
      condition: service_healthy
    kafka-2:
      condition: service_healthy
    kafka-3:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - -T
      - "5"
      - http://localhost:8083/
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s
  networks:
    - platform

x-connect-environment: &connect-environment
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  TZ: UTC

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "${KAFKA_1_HOST_PORT:-29092}:9094"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:${KAFKA_1_HOST_PORT:-29092}
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "${KAFKA_2_HOST_PORT:-39092}:9094"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:${KAFKA_2_HOST_PORT:-39092}
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - "${KAFKA_3_HOST_PORT:-49092}:9094"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:${KAFKA_3_HOST_PORT:-49092}
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  connect-1:
    <<: *connect-common
    hostname: connect-1
    container_name: connect-1
    environment:
      <<: *connect-environment
      CONNECT_REST_ADVERTISED_HOST_NAME: connect-1

  connect-2:
    <<: *connect-common
    hostname: connect-2
    container_name: connect-2
    environment:
      <<: *connect-environment
      CONNECT_REST_ADVERTISED_HOST_NAME: connect-2

  connect-lb:
    image: haproxy:3.4.4-alpine3.24
    hostname: connect-lb
    container_name: connect-lb
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      connect-1:
        condition: service_healthy
      connect-2:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - type: bind
        source: ./haproxy/haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - -T
        - "5"
        - http://127.0.0.1:8083/
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - platform

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    hostname: kafka-ui
    container_name: kafka-ui
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      connect-lb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-8084}:8080"
    environment:
      JAVA_OPTS: -Xms128m -Xmx512m
      AUTH_TYPE: DISABLED
      DYNAMIC_CONFIG_ENABLED: "false"
      MCP_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: spark-connect-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_READONLY: "true"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect-lb:8083
      LOGGING_LEVEL_IO_KAFBAT_UI: INFO
      HTTP_ERROR_EXCLUDESTACKTRACES: "true"
      TZ: UTC
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - -T
        - "5"
        - http://127.0.0.1:8080/actuator/health
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - platform

networks:
  platform:
    name: common-network
    driver: bridge

volumes:
  kafka-1-data:
    name: spark-connect-lab_kafka-1-data
    external: true
  kafka-2-data:
    name: spark-connect-lab_kafka-2-data
    external: true
  kafka-3-data:
    name: spark-connect-lab_kafka-3-data
    external: true
