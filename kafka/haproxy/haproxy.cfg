global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option redispatch
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout check 5s

resolvers docker
    nameserver dns 127.0.0.11:53
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 3s

frontend connect_rest
    bind :8083
    default_backend connect_workers

backend connect_workers
    balance roundrobin
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server check inter 2s fall 3 rise 2 resolvers docker init-addr none
    server connect-1 connect-1:8083
    server connect-2 connect-2:8083
