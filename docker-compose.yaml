name: spark-connect-lab

services:
  spark-master:
    image: spark:4.1.2
    hostname: spark-master
    container_name: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "8080:8080"

    networks:
      - spark-network

  spark-worker-1:
    image: spark:4.1.2
    hostname: spark-worker-1
    container_name: spark-worker-1

    depends_on:
      - spark-master

    command:
      - /bin/bash
      - -lc
      - |
        until (echo > /dev/tcp/spark-master/7077) >/dev/null 2>&1; do
          echo "Waiting for Spark Master..."
          sleep 1
        done

        exec /opt/spark/bin/spark-class \
          org.apache.spark.deploy.worker.Worker \
          --cores 2 \
          --memory 2g \
          --webui-port 8081 \
          spark://spark-master:7077

    ports:
      - "8081:8081"

    volumes:
      - ./data:/opt/spark/data

    networks:
      - spark-network

  spark-worker-2:
    image: spark:4.1.2
    hostname: spark-worker-2
    container_name: spark-worker-2

    depends_on:
      - spark-master

    command:
      - /bin/bash
      - -lc
      - |
        until (echo > /dev/tcp/spark-master/7077) >/dev/null 2>&1; do
          echo "Waiting for Spark Master..."
          sleep 1
        done

        exec /opt/spark/bin/spark-class \
          org.apache.spark.deploy.worker.Worker \
          --cores 2 \
          --memory 2g \
          --webui-port 8081 \
          spark://spark-master:7077

    ports:
      - "8082:8081"

    volumes:
      - ./data:/opt/spark/data

    networks:
      - spark-network

  spark-connect:
    image: spark:4.1.2
    hostname: spark-connect
    container_name: spark-connect

    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

    command:
      - /bin/bash
      - -lc
      - |
        until (echo > /dev/tcp/spark-master/7077) >/dev/null 2>&1; do
          echo "Waiting for Spark Master..."
          sleep 1
        done

        exec /opt/spark/sbin/start-connect-server.sh --wait \
          --master spark://spark-master:7077 \
          --deploy-mode client \
          --driver-memory 1g \
          --executor-memory 1g \
          --conf spark.executor.cores=1 \
          --conf spark.cores.max=4 \
          --conf spark.sql.shuffle.partitions=4 \
          --conf spark.driver.host=spark-connect \
          --conf spark.driver.bindAddress=0.0.0.0 \
          --conf spark.driver.port=7078 \
          --conf spark.driver.blockManager.port=7079 \
          --conf spark.ui.port=4040 \
          --conf spark.connect.grpc.binding.address=0.0.0.0 \
          --conf spark.connect.grpc.binding.port=15002

    ports:
      - "15002:15002"
      - "4040:4040"

    expose:
      - "7078"
      - "7079"

    volumes:
      - ./data:/opt/spark/data

    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge